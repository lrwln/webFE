<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 200px;
            color: red;
            background-color: black;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div></div>

    <script>
        // 获取元素
        const div = document.querySelector('div')
        div.className = 'box'
        console.dir(div)
    </script>

</body>

</html>
