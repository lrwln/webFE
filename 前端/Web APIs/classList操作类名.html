<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<style>
    .box {
        width: 200px;
        height: 200px;
        margin: 0 auto;
        background-color: black;
        text-align: center;
    }

    .active {
        background-color: pink;
    }
</style>

<body>
    <div class="box">

    </div>
    <script>
        //首先获取元素
        const box = document.querySelector('.box')
        //添加类名
        box.classList.add('active')
    </script>
</body>

</html>
