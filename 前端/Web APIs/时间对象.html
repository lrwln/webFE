<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div></div>
    <script>

        const div = document.querySelector('div')
        function getMydate() {
            const date = new Date()//创建实例对象 
            //获取年月日时间 并且添加零
            let h = date.getHours()
            let m = date.getMinutes()
            let s = date.getSeconds()
            h = h < 10 ? '0' + h : h
            m = m < 10 ? '0' + m : m
            s = s < 10 ? '0' + s : s
            return `今天${date.getFullYear()}年${date.getMonth()}月${date.getDate()}日,${h}:${m}:${s}`
        }

        div.innerHTML = getMydate()
        setInterval(function () {
            div.innerHTML = getMydate()
        }, 1)
    </script>
</body>

</html>
