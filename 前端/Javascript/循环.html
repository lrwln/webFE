<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>



    <script>
        let num = +prompt('请输入循环次数:')
        let i = 0
        let sum = 0;
        while (i <= num) {
            // document.write(`<div>第${i + 1}次</div>`)
            sum += i;
            i++;
        }
        document.write(sum);


    </script>
</body>

</html>
