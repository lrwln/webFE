<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h2 {
            text-align: center;


        }

        table {
            border-collapse: collapse;
            height: 80px;
            margin: 0 auto;
        }

        td {
            padding: 5px 10px;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid black;

        }
    </style>


</head>

<body>
    <h2>订单详情</h2>
    <!-- 表格 -->
    <script>
        let price = +prompt('请输入商品价格:');
        let num = +prompt('请输入商品数量:');
        let address = prompt('请输入地址:');
        let total = num * price;
        document.write(`
<table>
        <tr>
            <th>商品信息</th>
            <th>商品价格</th>
            <th>商品数量</th>
            <th>商品总价</th>
            <th>收货地址</th>
        </tr>
        <tr>
            <td>小米手机</td>
            <td>${num}元</td>
            <td>${price}件</td>
            <td>${total}</td>
            <td>${address}</td>
        </tr>
    </table>
`)
    </script>
</body>

</html>
